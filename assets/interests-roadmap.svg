<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="100%">
  <defs>
    <linearGradient id="roadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', system-ui, sans-serif; }
  </style>

  <rect width="900" height="160" rx="8" fill="url(#roadBg)" stroke="#30363D" stroke-width="1.5" />

  <!-- Flow Line -->
  <line x1="80" y1="80" x2="820" y2="80" stroke="#30363D" stroke-width="3" />
  <line x1="80" y1="80" x2="620" y2="80" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6,4" />

  <!-- Node 1 -->
  <g transform="translate(100, 80)">
    <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#38BDF8" stroke-width="2.5" />
    <text x="0" y="4" class="mono" font-size="11" fill="#38BDF8" font-weight="bold" text-anchor="middle">01</text>
    <text x="0" y="-28" class="sans" font-size="12" font-weight="bold" fill="#F1F5F9" text-anchor="middle">Distributed Systems</text>
    <text x="0" y="36" class="mono" font-size="10" fill="#8B949E" text-anchor="middle">Microservices &amp; Concurrency</text>
  </g>

  <!-- Node 2 -->
  <g transform="translate(340, 80)">
    <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#818CF8" stroke-width="2.5" />
    <text x="0" y="4" class="mono" font-size="11" fill="#818CF8" font-weight="bold" text-anchor="middle">02</text>
    <text x="0" y="-28" class="sans" font-size="12" font-weight="bold" fill="#F1F5F9" text-anchor="middle">Cloud Infrastructure</text>
    <text x="0" y="36" class="mono" font-size="10" fill="#8B949E" text-anchor="middle">Docker, K8s &amp; Proxmox</text>
  </g>

  <!-- Node 3 -->
  <g transform="translate(580, 80)">
    <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#10B981" stroke-width="2.5" />
    <text x="0" y="4" class="mono" font-size="11" fill="#10B981" font-weight="bold" text-anchor="middle">03</text>
    <text x="0" y="-28" class="sans" font-size="12" font-weight="bold" fill="#F1F5F9" text-anchor="middle">Developer Tooling</text>
    <text x="0" y="36" class="mono" font-size="10" fill="#8B949E" text-anchor="middle">Git Automation &amp; AI Summaries</text>
  </g>

  <!-- Node 4 -->
  <g transform="translate(800, 80)">
    <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#FF4D4D" stroke-width="2.5" />
    <text x="0" y="4" class="mono" font-size="11" fill="#FF4D4D" font-weight="bold" text-anchor="middle">04</text>
    <text x="0" y="-28" class="sans" font-size="12" font-weight="bold" fill="#F1F5F9" text-anchor="middle">System Design</text>
    <text x="0" y="36" class="mono" font-size="10" fill="#8B949E" text-anchor="middle">High Availability &amp; Caching</text>
  </g>
</svg>
