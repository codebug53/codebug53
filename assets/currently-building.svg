<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
  </style>

  <!-- Terminal Window Frame -->
  <rect width="900" height="180" rx="8" fill="url(#termBg)" stroke="#30363D" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <path d="M 0,8 A 8,8 0 0 1 8,0 L 892,0 A 8,8 0 0 1 900,8 L 900,32 L 0,32 Z" fill="#21262D" />
  <line x1="0" y1="32" x2="900" y2="32" stroke="#30363D" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="20" cy="16" r="4.5" fill="#FF4D4D" opacity="0.8" />
  <circle cx="34" cy="16" r="4.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="48" cy="16" r="4.5" fill="#10B981" opacity="0.8" />

  <text x="70" y="20" class="mono" font-size="11" fill="#8B949E">azhar@system-node:~ (bash)</text>

  <!-- Commands & Output -->
  <!-- Line 1 -->
  <text x="25" y="60" class="mono" font-size="13">
    <tspan fill="#38BDF8">$</tspan> <tspan fill="#F1F5F9" font-weight="bold">whoami</tspan>
  </text>
  <text x="25" y="80" class="mono" font-size="13" fill="#8B949E">
    &gt; Computer Science Engineer in Progress @ VIT-AP University ('27)
  </text>

  <!-- Line 2 -->
  <text x="25" y="112" class="mono" font-size="13">
    <tspan fill="#38BDF8">$</tspan> <tspan fill="#F1F5F9" font-weight="bold">focus</tspan>
  </text>
  <text x="25" y="132" class="mono" font-size="13" fill="#10B981">
    [ Spring Boot ]   [ Microservices ]   [ Distributed Systems ]   [ Cloud Infra ]   [ DSA ]
  </text>
  
  <!-- Line 3 / Prompt Cursor -->
  <text x="25" y="158" class="mono" font-size="13">
    <tspan fill="#38BDF8">$</tspan> <tspan fill="#8B949E">status --active</tspan> <tspan fill="#FF4D4D">▋</tspan>
  </text>
</svg>
