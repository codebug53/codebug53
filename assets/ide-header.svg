      <tspan class="text-cyan" font-weight="bold"> developer</tspan>
      <tspan class="text-primary">: </tspan>
      <tspan class="text-purple">SoftwareEngineer</tspan>
      <tspan class="text-primary"> = {</tspan>
    </text>

    <!-- Line 3 -->
    <text x="135" y="116">
