      <tspan class="text-cyan">frontend</tspan>
      <tspan class="text-primary">: </tspan>
      <tspan class="text-emerald">"React / TypeScript / Vite"</tspan>
      <tspan class="text-primary"> },</tspan>
    </text>

    <!-- Line 8 -->
    <text x="135" y="226">
      <tspan class="text-primary">flagshipProjects:</tspan>
      <tspan class="text-primary"> {</tspan>
    </text>

    <!-- Line 9 -->
    <text x="155" y="248">
      <tspan class="text-amber">renkairoIDE</tspan>
      <tspan class="text-primary">: </tspan>
      <tspan class="text-emerald">"Cloud Development Environment with Docker Orchestration"</tspan>
      <tspan class="text-primary">,</tspan>
    </text>

    <!-- Line 10 -->
    <text x="155" y="270">
      <tspan class="text-amber">shiroEngine</tspan>
      <tspan class="text-primary">: </tspan>
      <tspan class="text-emerald">"High-Throughput Isolated Sandbox Execution Microservice"</tspan>
    </text>

    <!-- Line 11 -->
    <text x="135" y="292">
      <tspan class="text-primary">}</tspan>
    </text>

    <!-- Line 12 -->
    <text x="115" y="314">
      <tspan class="text-primary">};</tspan>
    </text>

    <!-- Line 13 -->
    <text x="115" y="336">
      <tspan class="text-coral" font-weight="bold">export default</tspan>
      <tspan class="text-primary"> developer;</tspan>
      <!-- Cursor -->
      <rect x="295" y="324" width="8" height="15" fill="#FF4D4D" opacity="0.8" class="pulse-dot" />
    </text>
  </g>

  <!-- Bottom Status Bar -->
  <path d="M 2,353 L 898,353 L 898,370 A 8,8 0 0 1 890,378 L 10,378 A 8,8 0 0 1 2,370 Z" fill="#0B0D11" stroke="#232734" stroke-width="1" />
  
  <text x="15" y="367" class="font-mono text-emerald" font-size="11">● READY</text>
  <text x="90" y="367" class="font-mono text-muted" font-size="11">git:(main)</text>
  <text x="180" y="367" class="font-mono text-cyan" font-size="11">UTF-8</text>
  <text x="240" y="367" class="font-mono text-muted" font-size="11">TypeScript JSX</text>
  <text x="730" y="367" class="font-mono text-amber" font-size="11">⚡ 0 Errors, 0 Warnings</text>
  <text x="880" y="367" class="font-mono text-coral" font-size="11" text-anchor="end">Ln 13, Col 24</text>
</svg>
