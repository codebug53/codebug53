      <tspan class="text-primary">,</tspan>
    </text>

    <!-- Line 5 -->
    <text x="135" y="160">
      <tspan class="text-primary">role:</tspan>
      <tspan class="text-emerald"> "Fullstack System Engineer &amp; Cloud Platform Builder"</tspan>
      <tspan class="text-primary">,</tspan>
    </text>

    <!-- Line 6 -->
    <text x="135" y="182">
      <tspan class="text-primary">focus:</tspan>
      <tspan class="text-primary"> [</tspan>
      <tspan class="text-emerald">"Microservices Architecture"</tspan>
