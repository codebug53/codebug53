<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <!-- Dark & Cyber Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D11" />
      <stop offset="50%" stop-color="#12151C" />
      <stop offset="100%" stop-color="#0E1015" />
    </linearGradient>

    <linearGradient id="titleBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181B24" />
      <stop offset="100%" stop-color="#12151C" />
    </linearGradient>

    <linearGradient id="coralCyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="activeTabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232734" />
      <stop offset="100%" stop-color="#12151C" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glowCoral" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    
    .text-coral { fill: #FF4D4D; }
    .text-cyan { fill: #38BDF8; }
    .text-emerald { fill: #10B981; }
    .text-amber { fill: #F59E0B; }
    .text-purple { fill: #A855F7; }
    .text-primary { fill: #F1F5F9; }
    .text-muted { fill: #64748B; }
    .text-subtle { fill: #475569; }
    .text-gutter { fill: #334155; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.98); }
    }
    .pulse-dot { animation: pulseGlow 2s infinite ease-in-out; }
  </style>

  <!-- IDE Window Frame -->
  <rect x="2" y="2" width="896" height="376" rx="10" fill="url(#bgGradient)" stroke="#232734" stroke-width="2"/>

  <!-- Title Bar -->
  <path d="M 2,12 A 10,10 0 0 1 12,2 L 888,2 A 10,10 0 0 1 898,12 L 898,42 L 2,42 Z" fill="url(#titleBarGrad)" />
  <line x1="2" y1="42" x2="898" y2="42" stroke="#232734" stroke-width="1" />

  <!-- Window Control Buttons (Red, Yellow, Green) -->
  <circle cx="24" cy="22" r="6" fill="#FF4D4D" />
  <circle cx="44" cy="22" r="6" fill="#F59E0B" />
  <circle cx="64" cy="22" r="6" fill="#10B981" />

  <!-- Tabs -->
  <!-- Active Tab -->
  <path d="M 90,10 L 250,10 L 250,42 L 90,42 Z" fill="url(#activeTabGrad)" stroke="#232734" stroke-width="1" />
  <line x1="90" y1="10" x2="250" y2="10" stroke="#FF4D4D" stroke-width="2" />
  <text x="105" y="27" class="font-mono text-cyan" font-size="12" font-weight="600">⚡ profile.ts</text>
  <text x="230" y="26" class="font-mono text-muted" font-size="11">×</text>

  <!-- Inactive Tab 1 -->
  <text x="270" y="27" class="font-mono text-muted" font-size="12">⚙️ shiro-engine.java</text>
  <!-- Inactive Tab 2 -->
  <text x="440" y="27" class="font-mono text-muted" font-size="12">🌐 cloud-architecture.json</text>

  <!-- Title Window Text / Session -->
  <text x="880" y="26" class="font-mono text-muted" font-size="11" text-anchor="end">RENKAIRO-IDE v2.4.0</text>

  <!-- Sidebar Left Accent Bar -->
  <rect x="2" y="43" width="48" height="310" fill="#0E1015" />
  <line x1="50" y1="43" x2="50" y2="353" stroke="#232734" stroke-width="1" />
  
  <!-- Sidebar Icons -->
  <text x="25" y="75" font-size="16" text-anchor="middle" fill="#38BDF8">📁</text>
  <text x="25" y="115" font-size="16" text-anchor="middle" fill="#64748B">🔍</text>
  <text x="25" y="155" font-size="16" text-anchor="middle" fill="#64748B">🌿</text>
  <text x="25" y="195" font-size="16" text-anchor="middle" fill="#FF4D4D">🐳</text>
  <text x="25" y="325" font-size="16" text-anchor="middle" fill="#64748B">⚙️</text>

  <!-- Editor Gutter / Line Numbers -->
