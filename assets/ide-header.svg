  <line x1="96" y1="43" x2="96" y2="353" stroke="#181B24" stroke-width="1" />
  
  <g class="font-mono text-gutter" font-size="12" text-anchor="end">
    <text x="85" y="72">01</text>
    <text x="85" y="94">02</text>
    <text x="85" y="116">03</text>
    <text x="85" y="138">04</text>
    <text x="85" y="160">05</text>
    <text x="85" y="182">06</text>
    <text x="85" y="204">07</text>
    <text x="85" y="226">08</text>
    <text x="85" y="248">09</text>
    <text x="85" y="270">10</text>
    <text x="85" y="292">11</text>
    <text x="85" y="314">12</text>
    <text x="85" y="336">13</text>
  </g>

  <!-- Code Editor Body -->
  <g class="font-mono" font-size="13">
    <!-- Line 1 -->
    <text x="115" y="72">
      <tspan class="text-coral" font-weight="bold">import</tspan>
      <tspan class="text-primary"> { </tspan>
      <tspan class="text-cyan">SoftwareEngineer</tspan>
      <tspan class="text-primary">, </tspan>
      <tspan class="text-cyan">SystemArchitect</tspan>
