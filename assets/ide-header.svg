      <tspan class="text-primary">],</tspan>
    </text>

    <!-- Line 7 -->
    <text x="135" y="204">
      <tspan class="text-primary">stack:</tspan>
      <tspan class="text-primary"> { </tspan>
      <tspan class="text-cyan">backend</tspan>
