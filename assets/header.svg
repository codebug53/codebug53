<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <!-- Dark Minimal Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D13" />
      <stop offset="50%" stop-color="#0E1118" />
      <stop offset="100%" stop-color="#0A0C10" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="glowCoral" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FF4D4D" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0B0D13" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0B0D13" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="accentLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <style>
    .title-text { font-family: 'Inter', -apple-system, 'SF Pro Display', sans-serif; font-weight: 800; letter-spacing: 4px; }
    .sub-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; letter-spacing: 1px; }
    .tag-text { font-family: 'Inter', sans-serif; font-weight: 500; }
  </style>

  <!-- Background -->
  <rect width="900" height="220" rx="12" fill="url(#bgGrad)" stroke="#1E2330" stroke-width="1.5" />
  <rect width="900" height="220" rx="12" fill="url(#glowCoral)" />
  <rect width="900" height="220" rx="12" fill="url(#glowCyan)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="900" height="3" rx="1" fill="url(#accentLineGrad)" />

  <!-- Main Content -->
  <!-- Status Badge -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="135" height="24" rx="12" fill="#161B26" stroke="#262D3D" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#10B981" />
    <text x="26" y="16" class="sub-text" font-size="10" fill="#94A3B8">RENKAIRO IDE</text>
  </g>

  <!-- Name Title -->
  <text x="50" y="112" class="title-text" font-size="34" fill="url(#titleGrad)">MAHAMMAD AZHAR</text>

  <!-- Subtitle / Role -->
  <text x="50" y="146" class="sub-text" font-size="13" fill="#38BDF8">
    <tspan fill="#FF4D4D">const</tspan> developer = <tspan fill="#F1F5F9">"Fullstack &amp; Systems Engineer"</tspan>;
  </text>

  <!-- Bottom Pills -->
  <g transform="translate(50, 172)">
    <text x="0" y="0" class="tag-text" font-size="12" fill="#64748B">Specializing in Java Microservices • Cloud IDEs • Container Sandboxing</text>
  </g>

  <!-- Decorative Window Dot Controls -->
  <circle cx="845" cy="30" r="5" fill="#FF4D4D" opacity="0.7"/>
  <circle cx="860" cy="30" r="5" fill="#F59E0B" opacity="0.7"/>
  <circle cx="875" cy="30" r="5" fill="#10B981" opacity="0.7"/>
</svg>
