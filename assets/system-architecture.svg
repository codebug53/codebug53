<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12151C" />
      <stop offset="100%" stop-color="#0B0D11" />
    </linearGradient>

    <linearGradient id="glowCoralGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="100%" stop-color="#D9383A" />
    </linearGradient>

    <linearGradient id="glowCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="glowEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .font-sans { font-family: 'Inter', system-ui, sans-serif; }
  </style>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="896" height="276" rx="10" fill="url(#cardBg)" stroke="#232734" stroke-width="2"/>

  <!-- Title -->
  <text x="25" y="32" class="font-mono" font-size="14" font-weight="700" fill="#FF4D4D">⚡ RENKAIRO CLOUD PLATFORM ARCHITECTURE</text>
  <text x="875" y="32" class="font-mono" font-size="11" fill="#64748B" text-anchor="end">SYSTEM TOPOLOGY // MICROSERVICES</text>
  <line x1="25" y1="45" x2="875" y2="45" stroke="#232734" stroke-width="1" />

  <!-- Node 1: Client UI -->
  <g transform="translate(35, 70)">
    <rect x="0" y="0" width="240" height="175" rx="8" fill="#181B24" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="32" rx="8" fill="#232734" />
    <text x="15" y="21" class="font-mono" font-size="12" font-weight="bold" fill="#38BDF8">🖥️ Rekairo-UI (Client)</text>
    
    <text x="15" y="58" class="font-mono" font-size="11" fill="#F1F5F9">• Monaco Editor Engine</text>
    <text x="15" y="82" class="font-mono" font-size="11" fill="#F1F5F9">• WebSocket Terminal</text>
    <text x="15" y="106" class="font-mono" font-size="11" fill="#F1F5F9">• Workspace File System</text>
    <text x="15" y="130" class="font-mono" font-size="11" fill="#F1F5F9">• Cyber Glassmorphism</text>

    <rect x="15" y="145" width="210" height="18" rx="4" fill="#0E1015" />
    <text x="120" y="158" class="font-mono" font-size="10" fill="#38BDF8" text-anchor="middle">React 18 • TypeScript • Tailwind</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(280, 150)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#FF4D4D" stroke-width="2" stroke-dasharray="4" />
    <polygon points="50,-4 58,0 50,4" fill="#FF4D4D" />
    <text x="25" y="-10" class="font-mono" font-size="9" fill="#FF4D4D" text-anchor="middle">WSS / REST</text>
  </g>

  <!-- Node 2: Core Backend -->
  <g transform="translate(345, 70)">
    <rect x="0" y="0" width="250" height="175" rx="8" fill="#181B24" stroke="#FF4D4D" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="32" rx="8" fill="#232734" />
    <text x="15" y="21" class="font-mono" font-size="12" font-weight="bold" fill="#FF4D4D">⚙️ RenKairo-App (Backend)</text>
    
    <text x="15" y="58" class="font-mono" font-size="11" fill="#F1F5F9">• Container Orchestrator</text>
    <text x="15" y="82" class="font-mono" font-size="11" fill="#F1F5F9">• SSH &amp; WebSocket Proxy</text>
    <text x="15" y="106" class="font-mono" font-size="11" fill="#F1F5F9">• Instance Provisioning</text>
    <text x="15" y="130" class="font-mono" font-size="11" fill="#F1F5F9">• AI Copilot Handler</text>

    <rect x="15" y="145" width="220" height="18" rx="4" fill="#0E1015" />
    <text x="125" y="158" class="font-mono" font-size="10" fill="#FF4D4D" text-anchor="middle">Java 21 • Spring Boot 3 • Security</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(600, 150)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#10B981" stroke-width="2" stroke-dasharray="4" />
    <polygon points="50,-4 58,0 50,4" fill="#10B981" />
    <text x="25" y="-10" class="font-mono" font-size="9" fill="#10B981" text-anchor="middle">gRPC / API</text>
  </g>

  <!-- Node 3: Shiro Execution Sandbox -->
  <g transform="translate(655, 70)">
    <rect x="0" y="0" width="210" height="175" rx="8" fill="#181B24" stroke="#10B981" stroke-width="1.5" />
    <rect x="0" y="0" width="210" height="32" rx="8" fill="#232734" />
    <text x="15" y="21" class="font-mono" font-size="12" font-weight="bold" fill="#10B981">🐳 Shiro Engine</text>
    
    <text x="15" y="58" class="font-mono" font-size="11" fill="#F1F5F9">• Isolated Docker Runtime</text>
    <text x="15" y="82" class="font-mono" font-size="11" fill="#F1F5F9">• Dynamic Code Runner</text>
    <text x="15" y="106" class="font-mono" font-size="11" fill="#F1F5F9">• Resource Limiter (CPU/RAM)</text>
    <text x="15" y="130" class="font-mono" font-size="11" fill="#F1F5F9">• Realtime Logs &amp; Metrics</text>

    <rect x="15" y="145" width="180" height="18" rx="4" fill="#0E1015" />
    <text x="105" y="158" class="font-mono" font-size="10" fill="#10B981" text-anchor="middle">Docker API • Linux CGroups</text>
  </g>
</svg>
