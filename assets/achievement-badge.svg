<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="100%" height="100%">
  <defs>
    <linearGradient id="achieveBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="50%" stop-color="#1C2128" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', system-ui, sans-serif; }
  </style>

  <rect width="900" height="100" rx="8" fill="url(#achieveBg)" stroke="#30363D" stroke-width="1.5" />
  <rect x="0" y="0" width="4" height="100" rx="2" fill="url(#goldGlow)" />

  <g transform="translate(30, 50)">
    <circle cx="20" cy="0" r="18" fill="#21262D" stroke="#F59E0B" stroke-width="2" />
    <text x="20" y="5" class="sans" font-size="14" text-anchor="middle" fill="#F59E0B">🏆</text>

    <text x="55" y="-6" class="sans" font-size="16" font-weight="bold" fill="#F1F5F9">MSME Hackathon Winner</text>
    <text x="55" y="16" class="mono" font-size="12" fill="#F59E0B">Most Innovative Award</text>

    <text x="830" y="5" class="mono" font-size="11" fill="#8B949E" text-anchor="end">NATIONAL LEVEL HACKATHON</text>
  </g>
</svg>
